[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbotx"
dynamic = ["version"]
description = "AI assistant platform with web interface, task board, and multi-channel support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
authors = [
    {name = "Paulo Coutinho", email = "paulocoutinhox@gmail.com"}
]
maintainers = [
    {name = "Paulo Coutinho", email = "paulocoutinhox@gmail.com"}
]
keywords = [
    "ai",
    "agent",
    "assistant",
    "bot",
    "llm",
    "skills",
    "chatbot",
    "telegram",
    "websocket",
    "fastapi",
    "litellm",
]

dependencies = [
    # core
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",

    # server
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "httpx>=0.28.1",
    "aiofiles>=24.0.0",
    "websockets<16.0",

    # llm
    "litellm>=1.50.0",
    "json-repair>=0.30.0",

    # channels
    "python-telegram-bot>=22.6",

    # scheduler
    "croniter>=5.0.0",

    # browser
    "python-cdp @ file:///Users/paulo/Developer/workspaces/python/python-cdp",

    # storage
    "boto3>=1.42.38",

    # web extraction
    "readability-lxml>=0.8.0",
    "lxml>=5.0.0",

    # auth
    "pyjwt>=2.9.0",

    # cli
    "click>=8.3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.14",
    "build>=1.4.0",
    "twine>=6.2.0",
]

[project.scripts]
openbotx = "openbotx.cli.commands:cli"

[project.urls]
Homepage = "https://github.com/openbotx/openbotx"
Repository = "https://github.com/openbotx/openbotx"
"Bug Tracker" = "https://github.com/openbotx/openbotx/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["openbotx*"]

[tool.setuptools.dynamic]
version = {attr = "openbotx.version.__version__"}

[tool.setuptools.package-data]
openbotx = [
    "skills/**/*.md",
    "templates/**/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
